services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
      - opensearch
      - minio
    volumes:
      - import_tmp:/data/imports
  worker:
    build: ./backend
    env_file: .env
    command:
      - ./scripts/start_worker.sh
    # optional: CELERY_CONCURRENCY in .env setzen, z. B. 4 oder 8
    depends_on:
      - db
      - redis
      - opensearch
      - minio
    volumes:
      - import_tmp:/data/imports
  db:
    # Bei Wechsel des DB-Images ist ein "docker compose down -v" notwendig,
    # da postgres:16-alpine nicht binär kompatibel mit dem vorherigen PostGIS-Image ist.
    # Das PostGIS-Image stellt die für die Migration benötigte Erweiterung bereit.
    image: postgis/postgis:16-3.4-alpine
    platform: linux/arm64
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-companies}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    platform: linux/arm64
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - plugins.security.disabled=true
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio123}
    command: server /data --console-address ':9001'
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
volumes:
  import_tmp:
  db_data:
  redis_data:
  opensearch_data:
  minio_data:
